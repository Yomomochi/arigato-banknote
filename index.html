<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ありがとうのインフレーション</title>
</head>
<body>
  
<h1>ありがとう紙幣ジェネレーター</h1>
<p>写真を選ぶと、紙幣の肖像に表示されます。</p>

<div class="banknote">
  <img
    id="template"
    src="【表】ありがとう新紙幣.PNG"
    alt="紙幣のテンプレート"
  >
  <img id="portrait" alt="モノクロの肖像写真">
  <canvas id="portraitCanvas" hidden></canvas>
</div>

<p>
  <label for="photo">肖像写真を選ぶ：</label>
  <input id="photo" type="file" accept="image/*">
</p>

<style>
  .banknote {
    position: relative;
    width: 100%;
    max-width: 700px;
  }

  #template {
    display: block;
    width: 100%;
    height: auto;
  }

  #portrait {
  display: none;
  position: absolute;

  left: 68%;
  top: 29%;
  width: 22%;
  height: 50%;

  object-fit: cover;
  object-position: center;
  filter: grayscale(100%);
  border-radius: 50%;
    
object-fit: cover;
object-position: center;
filter: grayscale(100%) sepia(100%) hue-rotate(285deg) saturate(45%) contrast(125%) brightness(90%);
border-radius: 50%;
-webkit-mask-image: radial-gradient(
  ellipse at center,
  black 72%,
  transparent 100%
);
mask-image: radial-gradient(
  ellipse at center,
  black 72%,
  transparent 100%
);
}
</style>

<script>
  const photoInput = document.getElementById("photo");
  const portrait = document.getElementById("portrait");

  photoInput.addEventListener("change", function () {
    const file = photoInput.files[0];

    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    portrait.onload = function () {
      portrait.style.display = "block";
    };

    portrait.src = imageURL;
  });const portraitCanvas = document.getElementById("portraitCanvas");
const ctx = portraitCanvas.getContext("2d");

function makeEngraving() {
  const w = portrait.naturalWidth;
  const h = portrait.naturalHeight;

  if (!w || !h) return;

  portraitCanvas.width = w;
  portraitCanvas.height = h;

  ctx.drawImage(portrait, 0, 0, w, h);

  const imageData = ctx.getImageData(0, 0, w, h);
  const pixels = imageData.data;

  // 紙幣になじむ、くすんだローズブラウン
  const ink = { r: 143, g: 98, b: 104 };

  for (let i = 0; i < pixels.length; i += 4) {
    const brightness =
      (pixels[i] * 0.299 +
       pixels[i + 1] * 0.587 +
       pixels[i + 2] * 0.114) / 255;

    // 明るい部分は紙色、暗い部分はインク色にする
    const tone = Math.max(
      0,
      Math.min(1, (brightness - 0.12) / 0.88)
    );

    pixels[i] = ink.r + (245 - ink.r) * tone;
    pixels[i + 1] = ink.g + (235 - ink.g) * tone;
    pixels[i + 2] = ink.b + (220 - ink.b) * tone;
  }

  ctx.putImageData(imageData, 0, 0);

  portrait.src = portraitCanvas.toDataURL("image/png");
}

portrait.addEventListener("load", makeEngraving);
</script>

</body>
</html>

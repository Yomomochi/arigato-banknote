<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ありがとうのインフレーション</title>
</head>
<body>
  
<h1>ありがとう紙幣ジェネレーター</h1>
<p>写真を選ぶと、紙幣の肖像に表示されます。</p>

<div class="banknote">
  <img
    id="template"
    src="【表】ありがとう新紙幣.PNG"
    alt="紙幣のテンプレート"
  >
  <img id="portrait" alt="モノクロの肖像写真">
  <img id="portraitProcessed" alt="版画風の肖像写真">
</div>

<p>
  <label for="photo">肖像写真を選ぶ：</label>
  <input id="photo" type="file" accept="image/*">
</p>

<style>
  .banknote {
    position: relative;
    width: 100%;
    max-width: 700px;
  }

  #template {
    display: block;
    width: 100%;
    height: auto;
  }

  #portrait {
  display: none;
  position: absolute;

  left: 68%;
  top: 29%;
  width: 22%;
  height: 50%;

  object-fit: cover;
  object-position: center;
  filter: grayscale(100%);
  border-radius: 50%;
    
object-fit: cover;
object-position: center;
filter: grayscale(100%) sepia(100%) hue-rotate(285deg) saturate(45%) contrast(125%) brightness(90%);
border-radius: 50%;
-webkit-mask-image: radial-gradient(
  ellipse at center,
  black 72%,
  transparent 100%
);
mask-image: radial-gradient(
  ellipse at center,
  black 72%,
  transparent 100%
);
}
</style>

<script>
const photoInput = document.getElementById("photo");
const portrait = document.getElementById("portrait");

let originalImageURL = null;

photoInput.addEventListener("change", function () {
  const file = photoInput.files[0];
  if (!file) return;

  if (originalImageURL) {
    URL.revokeObjectURL(originalImageURL);
  }

  originalImageURL = URL.createObjectURL(file);

  portrait.onload = function () {
    portrait.style.display = "block";
  };

  portrait.src = originalImageURL;
});
</script>

</body>
</html>

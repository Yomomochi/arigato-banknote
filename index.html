
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ありがとうのインフレーション</title>

  <style>
    body {
      font-family: sans-serif;
      padding: 16px;
    }

    .banknote {
      position: relative;
      width: 100%;
      max-width: 700px;
    }

    #template {
      display: block;
      width: 100%;
      height: auto;
    }

    /* 元画像は読み込み用。画面には表示しない */
    #portrait {
      display: none;
    }

    /* 加工した肖像だけを紙幣に重ねる */
    #portraitProcessed {
      display: none;
      position: absolute;
      left: 68%;
      top: 29%;
      width: 22%;
      height: 50%;
      object-fit: cover;
      object-position: center;
      border-radius: 50%;

      -webkit-mask-image: radial-gradient(
        ellipse at center,
        black 72%,
        transparent 100%
      );
      mask-image: radial-gradient(
        ellipse at center,
        black 72%,
        transparent 100%
      );
    }
    
#messageText {
  position: absolute;

  /* 文字枠の位置と大きさ */
  left: 8%;
  top: 37%;
  width: 27%;
  height: 35%;

  box-sizing: border-box;
  padding: 3%;

  /* 文字を枠の中央に配置 */
  display: flex;
  align-items: center;
  justify-content: center;

  /* 枠からはみ出さないようにする */
  overflow: hidden;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  text-align: center;

  color: #58353b;
  font-family: serif;
  font-size: 18px;
  line-height: 1.2;
}

  </style>
  <script src="https://cdn.jsdelivr.net/npm/html-to-image@1.11.13/dist/html-to-image.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"></script>
</head>
<body>
  <h1>ありがとう紙幣ジェネレーター</h1>
  <p>写真を選ぶと、紙幣の肖像に表示されます。</p>

  <div class="banknote">
    <img
      id="template"
      src="【表】ありがとう新紙幣.PNG"
      alt="紙幣のテンプレート"
    >
    <img id="portrait" alt="">
    <img id="portraitProcessed" alt="版画風の肖像写真">
    <div id="messageText"></div>
  </div>
  <button id="saveButton">ありがとう紙幣を保存する</button>

<div id="saveHelp" style="display:none; margin-top:16px;">
  <p>画像を長押しして保存するか、共有メニューから保存してください。</p>
  <img id="savePreview"
       alt="保存するありがとう紙幣"
       style="display:block; max-width:100%; height:auto;">
</div>

  <p>
    <label for="photo">肖像写真を選ぶ：</label>
    <input id="photo" type="file" accept="image/*">
  </p>
<p>
  <label for="messageInput">紙幣に入れるメッセージ：</label><br>
  <textarea
    id="messageInput"
    rows="4"
    maxlength="120"
    placeholder="ここにありがとうのメッセージを入力！"
  ></textarea>
</p>

  <script>
const photoInput = document.getElementById("photo");
const portrait = document.getElementById("portrait");
const portraitProcessed =
  document.getElementById("portraitProcessed");

const messageInput = document.getElementById("messageInput");
const messageText = document.getElementById("messageText");

let originalImageURL = null;

// 写真を選んだときの処理
photoInput.addEventListener("change", function () {
  const file = photoInput.files[0];
  if (!file) return;

  if (originalImageURL) {
    URL.revokeObjectURL(originalImageURL);
  }

  originalImageURL = URL.createObjectURL(file);

  portrait.onload = function () {
    try {
      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");

      canvas.width = portrait.naturalWidth;
      canvas.height = portrait.naturalHeight;

      ctx.drawImage(portrait, 0, 0);

      const imageData = ctx.getImageData(
        0, 0, canvas.width, canvas.height
      );
      const pixels = imageData.data;

      const ink = { r: 88, g: 53, b: 59 };
      const paper = { r: 218, g: 192, b: 187 };

      for (let i = 0; i < pixels.length; i += 4) {
        const brightness =
          (pixels[i] * 0.299 +
           pixels[i + 1] * 0.587 +
           pixels[i + 2] * 0.114) / 255;

        const tone = Math.max(
          0,
          Math.min(1, (brightness - 0.15) / 0.75)
        );

        pixels[i] = ink.r * (1 - tone) + paper.r * tone;
        pixels[i + 1] =
          ink.g * (1 - tone) + paper.g * tone;
        pixels[i + 2] =
          ink.b * (1 - tone) + paper.b * tone;
      }

      ctx.putImageData(imageData, 0, 0);

      portraitProcessed.onload = function () {
        portraitProcessed.style.display = "block";
      };

      portraitProcessed.src = canvas.toDataURL("image/png");

    } catch (error) {
      console.error(error);
      alert("写真の加工に失敗しました。");
    }
  };

  portrait.src = originalImageURL;
});

// 文章が枠に収まるように調整
function fitMessageText() {
  messageText.textContent = messageInput.value;

  let size = 18;
  messageText.style.fontSize = size + "px";

  while (
    (messageText.scrollHeight > messageText.clientHeight ||
     messageText.scrollWidth > messageText.clientWidth) &&
    size > 6
  ) {
    size--;
    messageText.style.fontSize = size + "px";
  }
}

messageInput.addEventListener("input", fitMessageText);
window.addEventListener("resize", fitMessageText);
    

const saveButton = document.getElementById("saveButton");

saveButton.addEventListener("click", async function () {
  const banknote = document.querySelector(".banknote");
  const template = document.getElementById("template");
  const portraitProcessed = document.getElementById("portraitProcessed");
  const messageText = document.getElementById("messageText");

  try {
    saveButton.disabled = true;
    saveButton.textContent = "画像を作成中…";

    let dataUrl;

    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      await template.decode();

      const rect = banknote.getBoundingClientRect();
      const scale = template.naturalWidth / rect.width;

      const canvas = document.createElement("canvas");
      canvas.width = template.naturalWidth;
      canvas.height = template.naturalHeight;

      const ctx = canvas.getContext("2d");

      ctx.drawImage(template, 0, 0, canvas.width, canvas.height);

      const portraitStyle = getComputedStyle(portraitProcessed);

      if (
        portraitProcessed.style.display !== "none" &&
        portraitProcessed.complete &&
        portraitProcessed.naturalWidth > 0
      ) {
        const x = parseFloat(portraitStyle.left) / 100 * rect.width * scale;
        const y = parseFloat(portraitStyle.top) / 100 * rect.height * scale;
        const w = parseFloat(portraitStyle.width) / 100 * rect.width * scale;
        const h = parseFloat(portraitStyle.height) / 100 * rect.height * scale;

        ctx.save();
        ctx.beginPath();
        ctx.ellipse(x + w / 2, y + h / 2, w / 2, h / 2, 0, 0, Math.PI * 2);
        ctx.clip();
        ctx.drawImage(portraitProcessed, x, y, w, h);
        ctx.restore();
      }

      const messageStyle = getComputedStyle(messageText);
      const mx = parseFloat(messageStyle.left) / 100 * rect.width * scale;
      const my = parseFloat(messageStyle.top) / 100 * rect.height * scale;
      const mw = parseFloat(messageStyle.width) / rect.width * canvas.width;
      const mh = parseFloat(messageStyle.height) / rect.height * canvas.height;

      ctx.save();
      ctx.beginPath();
      ctx.rect(mx, my, mw, mh);
      ctx.clip();

      ctx.fillStyle = messageStyle.color;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";

      const fontSize = parseFloat(messageStyle.fontSize) * scale;
      ctx.font = `${fontSize}px serif`;

      const lines = messageText.innerText.split("\n");
      const lineHeight = fontSize * 1.2;
      const totalHeight = lines.length * lineHeight;
      let ty = my + mh / 2 - totalHeight / 2 + lineHeight / 2;

      for (const line of lines) {
        ctx.fillText(line, mx + mw / 2, ty, mw * 0.94);
        ty += lineHeight;
      }

      ctx.restore();
      dataUrl = canvas.toDataURL("image/png");
    } else {
      dataUrl = await htmlToImage.toPng(banknote, {
        pixelRatio: 2,
        cacheBust: true,
        filter: function (node) {
          return node.id !== "portrait";
        }
      });
    }

      }

    } else {
      dataUrl = await htmlToImage.toPng(banknote, {
        pixelRatio: 2,
        cacheBust: true,
        filter: function (node) {
          return node.id !== "portrait";
        }
      });
    }

    if (/iPhone|iPad|iPod/.test(navigator.userAgent)) {
      const preview = document.getElementById("savePreview");
      preview.src = dataUrl;
      document.getElementById("saveHelp").style.display = "block";
      preview.style.display = "block";
    } else {
      const link = document.createElement("a");
      link.download = "ありがとう紙幣.png";
      link.href = dataUrl;
      link.click();
    }
  } catch (error) {
    console.error("保存エラーの詳細:", error);
    alert("画像の作成に失敗しました: " + (error.message || error));
  } finally {
    saveButton.disabled = false;
    saveButton.textContent = "ありがとう紙幣を保存する";
  }
});


</script>
</body>
</html>

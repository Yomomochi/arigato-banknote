<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>ありがとうのインフレーション</title>
</head>
<body>
  
<h1>ありがとう紙幣ジェネレーター</h1>
<p>写真を選ぶと、紙幣の肖像に表示されます。</p>

<div class="banknote">
  <img
    id="template"
    src="【表】ありがとう紙幣.PNG"
    alt="紙幣のテンプレート"
  >
  <img id="portrait" alt="モノクロの肖像写真">
</div>

<p>
  <label for="photo">肖像写真を選ぶ：</label>
  <input id="photo" type="file" accept="image/*">
</p>

<style>
  .banknote {
    position: relative;
    width: 100%;
    max-width: 700px;
  }

  #template {
    display: block;
    width: 100%;
    height: auto;
  }

  #portrait {
    display: none;
    position: absolute;

    /* あとで紙幣の肖像枠に合わせて調整する */
    left: 10%;
    top: 20%;
    width: 20%;
    height: 30%;

    object-fit: cover;
    filter: grayscale(100%);
  }
</style>

<script>
  const photoInput = document.getElementById("photo");
  const portrait = document.getElementById("portrait");

  photoInput.addEventListener("change", function () {
    const file = photoInput.files[0];

    if (!file) return;

    const imageURL = URL.createObjectURL(file);

    portrait.onload = function () {
      portrait.style.display = "block";
    };

    portrait.src = imageURL;
  });
</script>

</body>
</html>
